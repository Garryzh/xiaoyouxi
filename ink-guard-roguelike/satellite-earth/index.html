<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>OrbitLive · 全球卫星实时追踪</title>
  <meta name="description" content="CelesTrak TLE + satellite.js SGP4 · 浏览器本地实时推算全球在轨卫星" />
  <meta name="theme-color" content="#02060c" />
  <style>
    @font-face {
      font-family: 'Geist Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist Sans';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-500-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-400-normal.woff2') format('woff2');
    }

    :root {
      --bg: #02060c;
      --panel: rgba(6, 12, 22, 0.72);
      --line: rgba(120, 200, 255, 0.14);
      --text: #e8f4ff;
      --muted: rgba(180, 210, 235, 0.55);
      --accent: #5ee7ff;
      --danger: #ff8b7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
      touch-action: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 50% 45%, transparent 40%, rgba(1, 4, 10, 0.55) 100%);
    }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.ready .ui { opacity: 1; }

    .panel {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      width: min(320px, calc(100vw - 36px));
      padding: 18px 18px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      pointer-events: auto;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    }

    .brand {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .panel h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }
    .panel .sub {
      margin-top: 6px;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
      line-height: 1.45;
    }

    .meta {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(94, 231, 255, 0.06);
      border: 1px solid rgba(94, 231, 255, 0.12);
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(210, 235, 255, 0.75);
    }
    .meta strong { color: var(--accent); font-weight: 500; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      margin-bottom: 8px;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .groups {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: min(42vh, 360px);
      overflow: auto;
      padding-right: 2px;
    }
    .groups::-webkit-scrollbar { width: 4px; }
    .groups::-webkit-scrollbar-thumb {
      background: rgba(94, 231, 255, 0.25);
      border-radius: 4px;
    }

    .group {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    .group:hover { background: rgba(255, 255, 255, 0.04); }
    .group.active {
      background: rgba(94, 231, 255, 0.08);
      border-color: rgba(94, 231, 255, 0.18);
    }
    .group .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }
    .group .name {
      font-size: 13px;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .group .name small {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .group .count {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .timebar {
      position: absolute;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .timebar button {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(230, 245, 255, 0.75);
      border-radius: 999px;
      padding: 7px 11px;
      cursor: pointer;
      min-width: 42px;
    }
    .timebar button:hover { color: #fff; border-color: rgba(94, 231, 255, 0.35); }
    .timebar button.active {
      background: rgba(94, 231, 255, 0.16);
      border-color: rgba(94, 231, 255, 0.45);
      color: #d9fbff;
    }

    .clock {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: rgba(220, 240, 255, 0.88);
      padding: 0 8px;
      min-width: 190px;
      text-align: center;
    }

    .hud-right {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .chip {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
      color: var(--muted);
    }
    .chip strong { color: var(--text); font-weight: 500; }

    .hint {
      position: absolute;
      bottom: max(78px, calc(env(safe-area-inset-bottom) + 70px));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Geist Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(180, 210, 235, 0.35);
      pointer-events: none;
    }

    .footer-note {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      font-family: 'Geist Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      color: rgba(160, 190, 220, 0.35);
      max-width: 280px;
      line-height: 1.45;
      pointer-events: none;
    }

    /* Loader */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(30, 90, 120, 0.28), transparent 55%),
        #02060c;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }
    .loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-inner { text-align: center; width: min(420px, calc(100vw - 40px)); }
    .loader-orbit {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 1px solid rgba(94, 231, 255, 0.25);
      position: relative;
    }
    .loader-orbit::before {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      top: -4px;
      left: 50%;
      margin-left: -4px;
      animation: orbit 1.4s linear infinite;
      transform-origin: 4px 25px;
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    .loader h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
    }
    .loader p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .loader-bar {
      margin: 22px auto 0;
      width: 180px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .loader-bar > i {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sweep 1.2s ease-in-out infinite;
    }
    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(280%); }
    }
    .loader-status {
      margin-top: 14px;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      min-height: 1.2em;
    }
    .loader.error .loader-status { color: var(--danger); }
    .loader.error .loader-bar { display: none; }
    .loader-note {
      margin-top: 18px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(170, 200, 225, 0.4);
    }

    @media (max-width: 720px) {
      .panel { width: min(300px, calc(100vw - 24px)); left: 12px; top: 12px; padding: 14px; }
      .groups { max-height: 28vh; }
      .timebar {
        left: 12px;
        right: 12px;
        transform: none;
        width: auto;
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 18px;
      }
      .clock { min-width: 100%; order: -1; padding-bottom: 4px; }
      .hint, .footer-note { display: none; }
      .hud-right { top: auto; bottom: 110px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/",
      "satellite.js": "https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.es.js"
    }
  }
  </script>
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>

  <div class="ui" id="ui">
    <aside class="panel">
      <div class="brand">ORBITLIVE</div>
      <h1>全球卫星实时追踪</h1>
      <p class="sub">CelesTrak TLE · satellite.js SGP4 · 本地逐帧推算</p>

      <div class="meta" id="meta">
        正在准备轨道数据…
      </div>

      <div class="section-title">
        <span>星座分组</span>
        <span id="visible-count">—</span>
      </div>
      <div class="groups" id="groups"></div>
    </aside>

    <div class="hud-right">
      <div class="chip">FPS <strong id="fps">—</strong></div>
      <div class="chip" id="focus-chip" hidden>FOCUS <strong id="focus-name">—</strong></div>
    </div>

    <div class="timebar" role="group" aria-label="Time controls">
      <button type="button" id="btn-now" title="Jump to now">⏮ 现在</button>
      <button type="button" id="btn-pause" class="active" aria-pressed="false">❚❚</button>
      <button type="button" data-speed="1" class="speed active">1×</button>
      <button type="button" data-speed="10" class="speed">10×</button>
      <button type="button" data-speed="60" class="speed">60×</button>
      <button type="button" data-speed="300" class="speed">300×</button>
      <button type="button" data-speed="1000" class="speed">1000×</button>
      <div class="clock" id="clock">—</div>
    </div>

    <div class="hint">DRAG 旋转 · SCROLL 缩放 · 点击星座过滤 · ISS 自动轨道/覆盖</div>
    <div class="footer-note">数据：CelesTrak NORAD GP · SGP4 本地推算 · 无 API key · TLE 约每 2 小时刷新</div>
  </div>

  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-orbit" aria-hidden="true"></div>
      <h1>ORBITLIVE</h1>
      <p>全球卫星实时追踪</p>
      <div class="loader-bar"><i></i></div>
      <div class="loader-status" id="loader-status">正在检测环境…</div>
      <div class="loader-note">轨道数据：CelesTrak NORAD GP（TLE） · 推算：satellite.js SGP4（浏览器本地实时计算）</div>
    </div>
  </div>

  <script type="module" src="./main.js?v=citylights1"></script>
</body>
</html>
